    <script>
      // Apply the saved/system theme before rendering to avoid a light flash.
      (() => {
        let saved;
        try { saved = localStorage.getItem('portfolio-theme'); } catch {}
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved === 'dark' || saved === 'light' ? saved : dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#15171B' : '#F7F8FA';
        // Discover a directly opened case image before React and its page chunk load.
        const study = location.hash.match(/^#\/projects\/(saldoa|pixelrank|sneakers|movieslib)(?:#|$)/);
        if (study) {
          const image = document.createElement('link');
          image.rel = 'preload';
          image.as = 'image';
          image.href = '/projects/' + study[1] + '-home.webp';
          image.setAttribute('fetchpriority', 'high');
          document.head.append(image);
        }
      })();
    </script>
